name: Build, publish and deploy to MonsterASP.NET V2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      -                                                           
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check files
        run: |
          Get-ChildItem
          Get-ChildItem ProductApi

      - name: Restore
        run: dotnet restore ProductApi/ProductApi.csproj

      - name: Build
        run: dotnet build ProductApi/ProductApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ProductApi/ProductApi.csproj --configuration Release --output ./publish

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'